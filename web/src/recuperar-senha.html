<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FIN-MULTIUSUARIO-ACESSO-01: pedido de recuperacao de senha (o e-mail e enviado pelo Supabase Auth). -->
    <link rel="icon" type="image/png" sizes="32x32" href="icones/icone-32.png?v=2">
    <title>Recuperar senha — Controle Financeiro</title>
    <link rel="stylesheet" href="css/shared/style.css">
    <link rel="stylesheet" href="css/shared/theme-light.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h1 class="login-title">Recuperar senha</h1>
        <p class="login-subtitle">Informe o e-mail da sua conta</p>

        <div class="login-error" id="rs-erro" role="alert" hidden></div>
        <p class="login-info" id="rs-aviso" role="status" hidden></p>

        <form id="rs-form" novalidate>
            <div class="login-field">
                <label for="rs-email">E-mail</label>
                <input type="email" id="rs-email" name="email" autocomplete="username" required autofocus>
            </div>
            <button type="submit" class="login-submit" id="rs-enviar">Enviar link de recuperação</button>
        </form>

        <p class="login-links"><a class="login-link" href="index.html">Voltar para a entrada</a></p>
    </main>

    <script src="config.js"></script>
    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/recuperar-senha.js"></script>
</body>
</html>
