<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Receitas do mês — Controle Financeiro</title>
    <link rel="stylesheet" href="css/shared/style.css">
    <link rel="stylesheet" href="css/shared/theme-light.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<!-- FIN-RECEITAS-1: receitas PREVISTAS por competencia. Previsao nao e dinheiro recebido: nada aqui
     registra recebimento nem movimenta conta bancaria. Escritas so para quem gerencia o perfil. -->
<body class="app-body" data-protegido hidden>
    <header class="app-header">
        <span class="app-marca">Controle Financeiro</span>
        <span class="app-usuario">
            <label class="app-perfil" for="perfil-ativo" hidden id="perfil-rotulo">Perfil
                <select id="perfil-ativo"></select>
            </label>
            <span id="usuario-email" class="app-email"></span>
            <button type="button" class="app-sair" id="sair">Sair</button>
        </span>
    </header>

    <main class="app-conteudo contas">
        <nav class="abas" aria-label="Seções">
            <a id="aba-contas" class="aba" href="contas.html">Contas</a>
            <a id="aba-receitas" class="aba aba-ativa" href="receitas.html" aria-current="page">Receitas</a>
            <a id="aba-cartoes" class="aba" href="cartoes.html">Cartões</a>
        </nav>
        <nav class="mes-nav" aria-label="Mês de competência">
            <a id="mes-anterior" class="mes-seta" href="#" aria-label="Mês anterior">◀</a>
            <h1 id="mes-titulo" class="mes-titulo"></h1>
            <a id="mes-proximo" class="mes-seta" href="#" aria-label="Próximo mês">▶</a>
        </nav>

        <p class="totais" id="totais" hidden>
            <span>Previsto <strong id="total-previsto"></strong></span>
            <span>Recebido <strong id="total-recebido"></strong></span>
            <span>A receber <strong id="total-a-receber"></strong></span>
        </p>
        <p class="receitas-nota" id="receitas-nota" hidden>Previsão não altera saldo. Recebimentos continuam sendo registrados no sistema atual.</p>

        <div class="acoes-mes" id="acoes-mes"></div>
        <div class="despesa-painel" id="receita-painel" hidden></div>
        <p class="geracao-resultado" id="acao-resultado" role="status" hidden></p>
        <div class="login-error" id="perfis-erro" role="alert" hidden></div>
        <p class="app-vazio" id="perfis-vazio" hidden>Nenhum perfil financeiro autorizado para esta conta.</p>
        <div class="login-error" id="receitas-erro" role="alert" hidden></div>
        <p class="app-vazio" id="receitas-vazio" hidden>Nenhuma receita nesta competência.</p>

        <section class="grupo" id="secao-receitas" aria-labelledby="titulo-receitas" hidden>
            <h2 class="grupo-titulo" id="titulo-receitas">Receitas</h2>
            <ul class="lista-contas" id="lista-receitas"></ul>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/receitas.js"></script>
</body>
</html>
