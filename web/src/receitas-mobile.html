<!DOCTYPE html>
<!-- FIN-MVP-MOBILE-04: Receitas mobile. Pagina propria, fora da moldura do desktop (como inicio.html, despesas-mobile.html
     e cartoes-mobile.html), com a estrutura e a identidade visual aprovadas (css/mobile-base.css e css/mobile-modulo.css).
     Os dados e as operacoes sao os da tela de Receitas do desktop: js/receitas-servico.js (fontes, previsoes,
     recebimentos, recebimento, estorno, nova receita e edicao da fonte) e js/receitas-lista.js (a mesma lista, ordem e
     totais). O desktop nao muda. -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Receitas — Financeiro</title>
    <link rel="stylesheet" href="css/mobile-base.css">
    <link rel="stylesheet" href="css/mobile-modulo.css">
    <link rel="stylesheet" href="css/receitas-mobile.css">
</head>
<body class="mob mob-modulo mob-receitas" data-protegido hidden>
    <header class="mob-cabecalho">
        <div class="mob-cabecalho-miolo">
        <span class="mob-cabecalho-lado">
            <a class="mob-icone-botao" id="mob-voltar" href="inicio.html" data-inicio aria-label="Voltar à página principal">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </a>
        </span>
        <div class="mob-titulo-bloco">
            <h1 class="mob-titulo">Receitas</h1>
            <span class="mob-subtitulo" id="mob-perfil"></span>
        </div>
        <span class="mob-cabecalho-lado direita">
            <button type="button" class="mob-icone-botao" id="mob-filtros" aria-label="Filtros" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                <span class="mob-filtro-marca" id="mob-filtro-marca" hidden></span>
            </button>
            <button type="button" class="mob-icone-botao" id="mob-nova" aria-label="Nova receita" aria-haspopup="dialog" hidden>
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </span>
        </div>
    </header>

    <main class="mob-conteudo">
        <nav class="mob-competencia" aria-label="Competência">
            <button type="button" class="mob-competencia-seta" id="mob-mes-anterior" aria-label="Mês anterior">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <span class="mob-competencia-centro">
                <span class="mob-competencia-calendario" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
                </span>
                <output class="mob-competencia-mes" id="mob-competencia" aria-live="polite"></output>
            </span>
            <button type="button" class="mob-competencia-seta" id="mob-mes-seguinte" aria-label="Mês seguinte">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
        </nav>

        <section class="mob-resumo" id="mob-resumo" aria-label="Resumo das receitas da competência" hidden></section>
        <p class="mob-aviso" id="mob-aviso" role="status" hidden></p>
        <h2 class="mob-secao-titulo" id="mob-lista-titulo" hidden>Receitas do mês</h2>
        <section class="mob-lista" id="mob-lista" aria-labelledby="mob-lista-titulo" aria-busy="true"></section>
        <section class="mob-lista mob-atrasadas" id="mob-atrasadas" aria-label="Receitas atrasadas" hidden></section>
    </main>

    <nav class="mob-barra" aria-label="Navegação">
        <div class="mob-barra-miolo">
        <a class="mob-barra-item" href="inicio.html" data-inicio>
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20.5h-5.8v-5.8H9.3v5.8H3.5v-9.3Z"/></svg>
            <span>Início</span>
        </a>
        <a class="mob-barra-item" data-modulo="lancar" data-destino="lancamento-mobile.html" aria-disabled="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
            <span>Lançar</span>
        </a>
        <a class="mob-barra-item" data-modulo="resumo" data-destino="despesas-mobile.html" aria-disabled="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M6 20v-7M12 20V5M18 20v-10"/></svg>
            <span>Resumo</span>
        </a>
        <button type="button" class="mob-barra-item" id="mob-mais" aria-haspopup="menu" aria-expanded="false" aria-controls="mob-menu-mais">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/></svg>
            <span>Mais</span>
        </button>
        </div>
        <div class="mob-menu-mais" id="mob-menu-mais" role="menu" aria-label="Mais opções" hidden>
            <button type="button" class="mob-menu-item" id="mob-sair" role="menuitem">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
                <span>Sair</span>
            </button>
        </div>
    </nav>

    <div class="mob-folha-fundo" id="mob-folha-fundo" hidden>
        <section class="mob-folha" id="mob-folha" role="dialog" aria-modal="true" aria-labelledby="mob-folha-titulo">
            <header class="mob-folha-topo">
                <h2 class="mob-folha-titulo" id="mob-folha-titulo"></h2>
                <button type="button" class="mob-icone-botao mob-folha-fechar" id="mob-folha-fechar" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <div class="mob-folha-corpo" id="mob-folha-corpo"></div>
        </section>
    </div>

    <script src="config.js"></script>
    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/receitas-mobile.js"></script>
</body>
</html>
