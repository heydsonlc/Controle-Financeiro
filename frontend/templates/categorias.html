{% extends "base.html" %}

{% block title %}Categorias - Controle Financeiro{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/categorias.css') }}">
{% endblock %}

{% block action_bar %}
    <div class="module-actionbar" aria-label="Ações de Categorias">
        <div class="module-actionbar-actions">
            <button class="action-icon-button primary" id="btn-nova-categoria" type="button" onclick="abrirModal()" title="Nova Categoria" aria-label="Nova Categoria">
                <span class="action-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </span>
                <span class="action-button-label">Nova Categoria</span>
            </button>
        </div>
    </div>
{% endblock %}

{% block content %}
    <div class="container">
        <main>
            <!-- Lista de categorias -->
            <div class="categorias-lista" id="categorias-lista">
                <p class="loading">Carregando categorias...</p>
            </div>
        </main>
    </div>

    <!-- Modal para adicionar/editar categoria -->
    <div id="modal-categoria" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-titulo">Nova Categoria</h2>
                <span class="close" onclick="fecharModal()">&times;</span>
            </div>

            <form id="form-categoria" onsubmit="salvarCategoria(event)">
                <input type="hidden" id="categoria-id">

                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" required
                           placeholder="Ex: Moradia, Transporte, Alimentação">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="3"
                              placeholder="Descrição opcional da categoria"></textarea>
                </div>

                <div class="form-group">
                    <label for="cor">Cor</label>
                    <div class="color-picker">
                        <input type="color" id="cor" name="cor" value="#6c757d">
                        <span id="cor-valor">#6c757d</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="ativo" name="ativo" checked>
                        <span>Categoria ativa</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='js/categorias.js') }}"></script>
    <script>
        function toggleMobileView() {
            document.body.classList.toggle('mobile-view');
            const btn = document.getElementById('mobile-btn');
            if (document.body.classList.contains('mobile-view')) {
                btn.innerHTML = '💻 Ver em Desktop';
            } else {
                btn.innerHTML = '📱 Ver em Mobile';
            }
        }
    </script>
{% endblock %}
